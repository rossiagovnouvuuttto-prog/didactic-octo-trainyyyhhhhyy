name: Build Rockstar Client 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ rockstar-1.21.11 ]
    paths:
      - '.github/workflows/build-rockstar-1.21.11.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prepared 1.21.11 source
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=12IZ9jAO3VbjBRVU7sP2tAoHDWYlpRMV4&export=download&confirm=t' \
            -o rockstar-client-1.21.11-port.zip
          ls -lh rockstar-client-1.21.11-port.zip
          file rockstar-client-1.21.11-port.zip
          unzip -t rockstar-client-1.21.11-port.zip >/dev/null

      - name: Extract source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir work
          unzip -q rockstar-client-1.21.11-port.zip -d work
          project="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$project"
          echo "PROJECT=$GITHUB_WORKSPACE/$project" >> "$GITHUB_ENV"
          echo "PROJECT=$GITHUB_WORKSPACE/$project"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect JAR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          jar="$(find "$PROJECT/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)"
          test -n "$jar"
          cp "$jar" release/rockstar-client-1.21.11.jar
          ls -lh release/rockstar-client-1.21.11.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockstar-client-1.21.11
          path: release/rockstar-client-1.21.11.jar

      - name: Publish JAR to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/rockstar-client-1.21.11.jar
          git commit -m 'Build Rockstar Client 1.21.11 [skip ci]' || true
          git push origin HEAD:rockstar-1.21.11
