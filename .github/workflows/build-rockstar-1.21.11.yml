name: Build Rockstar Client 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ rockstar-1.21.11 ]
    paths:
      - 'rockstar-client-1.21.11-port.zip'
      - '.github/workflows/build-rockstar-1.21.11.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source archive
        shell: bash
        run: |
          test -f rockstar-client-1.21.11-port.zip || {
            echo 'Upload rockstar-client-1.21.11-port.zip to this branch first.'
            exit 2
          }

      - name: Extract source
        shell: bash
        run: |
          rm -rf work
          mkdir work
          unzip -q rockstar-client-1.21.11-port.zip -d work
          project="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$project"
          echo "PROJECT=$project" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: bash
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Collect JAR
        shell: bash
        run: |
          mkdir -p release
          jar="$(find "$PROJECT/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)"
          test -n "$jar"
          cp "$jar" release/rockstar-client-1.21.11.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockstar-client-1.21.11
          path: release/rockstar-client-1.21.11.jar

      - name: Publish JAR to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/rockstar-client-1.21.11.jar
          git commit -m 'Build Rockstar Client 1.21.11 [skip ci]' || true
          git push origin HEAD:rockstar-1.21.11
