name: Build ABOBUS123 v19 ReallyVisuals 1.21.11

on:
  push:
    branches:
      - port-v19-reallyvisuals-1.21.11
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Reconstruct exact v19 source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          cat ci-xz/part*.b64 | base64 -d > source.tar.xz
          mkdir -p work
          tar -xJf source.tar.xz -C work
          test -f work/build.gradle
          test -d work/src/main/java

      - name: Apply compatibility patches
        run: python3 scripts/patch_v19_12111.py work

      - name: Build Fabric 1.21.11
        working-directory: work
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee build.log

      - name: Runtime mixin smoke test
        working-directory: work
        shell: bash
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          fi
          timeout 75s xvfb-run -a gradle --no-daemon runClient --stacktrace > runclient.log 2>&1
          code=$?
          echo "runClient exit=$code"
          tail -n 220 runclient.log || true
          if grep -Eqi 'Mixin apply for mod abobus123 failed|MixinApplyError|InvalidInjectionException|InvalidAccessorException|InvalidMixinException|MixinTransformerError|InjectionError' runclient.log; then
            echo 'ABOBUS123 runtime mixin failure detected'
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo 'runClient exited before smoke-test timeout'
            exit "$code"
          fi
          echo 'No ABOBUS123 mixin apply errors during client bootstrap window'

      - name: Collect mapped Minecraft jars for port diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p work/diagnostics
          find work/.gradle ~/.gradle -type f -name '*.jar' 2>/dev/null | grep -E 'minecraft|intermediary|yarn' | sort > work/diagnostics/jars.txt || true
          while IFS= read -r f; do
            case "$f" in
              *minecraft*1.21.11*.jar|*minecraft*merged*.jar|*minecraft*client*.jar)
                cp -n "$f" work/diagnostics/ 2>/dev/null || true
                ;;
            esac
          done < work/diagnostics/jars.txt
          ls -lh work/diagnostics || true

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abobus-v19-1.21.11-build-output
          if-no-files-found: warn
          path: |
            work/build/libs/*.jar
            work/build/reports/**
            work/build.log
            work/runclient.log
            work/run/logs/latest.log
            work/run/crash-reports/**
            work/diagnostics/**
