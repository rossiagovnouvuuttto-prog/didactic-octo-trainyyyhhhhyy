name: Build ABOBUS123 v19 ReallyVisuals 1.21.11

on:
  push:
    branches:
      - port-v19-reallyvisuals-1.21.11
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Reconstruct exact v19 source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          cat ci-xz/part*.b64 | base64 -d > source.tar.xz
          mkdir -p work
          tar -xJf source.tar.xz -C work
          test -f work/build.gradle
          test -d work/src/main/java

      - name: Apply compatibility patches
        run: python3 scripts/patch_v19_12111.py work

      - name: Build Fabric 1.21.11
        working-directory: work
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee build.log

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abobus-v19-1.21.11-build-output
          if-no-files-found: warn
          path: |
            work/build/libs/*.jar
            work/build/reports/**
            work/build.log
