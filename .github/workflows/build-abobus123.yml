name: Build ABOBUS123 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ABOBUS123-1.21.11-PORT.zip"
      - "scripts/patch_1_21_11.py"
      - ".github/workflows/build-abobus123.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f ABOBUS123-1.21.11-PORT.zip || (echo "ABOBUS123-1.21.11-PORT.zip not found" && exit 1)

      - name: Extract source
        run: unzip -o ABOBUS123-1.21.11-PORT.zip

      - name: Patch Minecraft 1.21.11 compatibility
        run: python3 scripts/patch_1_21_11.py

      - name: Debug current failing sources
        run: |
          echo '===== build files ====='
          find ABOBUS123-1.21.11-source -maxdepth 2 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print -exec sed -n '1,240p' {} \;
          echo '===== RectangleShader.java ====='
          sed -n '1,240p' ABOBUS123-1.21.11-source/src/main/java/aethereal/ui/shader/RectangleShader.java || true
          echo '===== PacketSecurity.java ====='
          sed -n '1,260p' ABOBUS123-1.21.11-source/src/main/java/aethereal/network/PacketSecurity.java || true
          echo '===== AmbienceEvent.java ====='
          sed -n '1,320p' ABOBUS123-1.21.11-source/src/main/java/aethereal/event/AmbienceEvent.java || true
          echo '===== MinecraftClientMixin.java ====='
          sed -n '1,320p' ABOBUS123-1.21.11-source/src/main/java/platform/inject/mixin/MinecraftClientMixin.java || true
          echo '===== mixin json ====='
          find ABOBUS123-1.21.11-source/src/main/resources -type f -name '*mixins*.json' -print -exec cat {} \;
          echo '===== references ====='
          grep -R -n -E 'RectangleShader|PacketSecurity|AmbienceEvent|MinecraftClientMixin' ABOBUS123-1.21.11-source/src/main/java ABOBUS123-1.21.11-source/src/main/resources || true

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Build ABOBUS123
        working-directory: ABOBUS123-1.21.11-source
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ABOBUS123-1.21.11
          path: |
            ABOBUS123-1.21.11-source/build/libs/*.jar
            !ABOBUS123-1.21.11-source/build/libs/*-sources.jar
