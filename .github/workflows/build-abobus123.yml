name: Build ABOBUS123 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ABOBUS123-1.21.11-PORT.zip"
      - ".github/workflows/build-abobus123.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f ABOBUS123-1.21.11-PORT.zip || (echo "ABOBUS123-1.21.11-PORT.zip not found" && exit 1)

      - name: Extract source
        run: unzip -o ABOBUS123-1.21.11-PORT.zip

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Build ABOBUS123
        working-directory: ABOBUS123-1.21.11-source
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ABOBUS123-1.21.11
          path: |
            ABOBUS123-1.21.11-source/build/libs/*.jar
            !ABOBUS123-1.21.11-source/build/libs/*-sources.jar
